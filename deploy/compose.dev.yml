# Local databases for development and tests. Start with: docker compose -f deploy/compose.dev.yml up -d
name: foldback-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: foldback
      POSTGRES_PASSWORD: foldback
      POSTGRES_DB: foldback
    # Override when the port is taken: FOLDBACK_DEV_PG_PORT=55432 docker compose ... up -d
    ports:
      - "${FOLDBACK_DEV_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./dev-init.sql:/docker-entrypoint-initdb.d/10-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foldback -d foldback"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Throwaway database for tests. It lives in memory and is wiped when the container stops.
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: foldback
      POSTGRES_PASSWORD: foldback
      POSTGRES_DB: foldback_test
    ports:
      - "${FOLDBACK_TEST_PG_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foldback -d foldback_test"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
